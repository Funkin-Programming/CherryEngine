name: Build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      os:
        required: true
        type: string
      buildArgs:
        required: true
        type: string
      artifactName:
        required: true
        type: string
      artifactPath:
        required: true
        type: string

env:
  HAXE_VERSION: 4.2.5
  PROJECT_NAME: CherryEngine

jobs:
  build:
    name: Build ${{ inputs.name }}
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        if: inputs.name == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Install libVLC
        if: inputs.name == 'Linux'
        run: sudo apt-get install -y libvlc-dev libvlccore-dev

      - name: Cache Haxelibs
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-${{ inputs.name }}-${{ hashFiles('**/hmm.json') }}
          restore-keys: haxelib-${{ inputs.name }}-

      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiet

      - name: Configure Android
        if: inputs.name == 'Android'
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Generate Keystore
        if: inputs.name == 'Android'
        run: |
          rm -f key.keystore
          keytool -genkeypair -v \
            -keystore key.keystore \
            -storetype JKS \
            -alias psychengine \
            -storepass psychengine \
            -keypass psychengine \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=CherryEngine, OU=Dev, O=Brenninho, L=BR, ST=BR, C=BR"

      - name: Verify Keystore
        if: inputs.name == 'Android'
        run: keytool -list -keystore key.keystore -storepass psychengine

      - name: Cache hxcpp
        uses: actions/cache@v4
        with:
          path: ~/.hxcpp
          key: hxcpp-${{ inputs.name }}-${{ hashFiles('**/Project.xml') }}
          restore-keys: hxcpp-${{ inputs.name }}-

      - name: Compile
        run: haxelib run lime build ${{ inputs.buildArgs }}

      - name: Make IPA
        if: inputs.name == 'iOS'
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir -p Payload
          mv *.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}
          path: ${{ inputs.artifactPath }}
          if-no-files-found: error